<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mazairita AR - Bienvenida</title>
    
    <!-- Librería A-Frame Base -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Librería AR.js para renderizado directo de cámara web -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Librería para control de animaciones GLB -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        /* Corrección total del fondo blanco y reseteo de márgenes */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: hidden !important;
            font-family: Arial, sans-serif;
            background-color: #000000 !important;
        }

        /* Fuerza al canvas de A-Frame y al video de la cámara a ocupar exactamente toda la pantalla sin barras */
        .a-canvas, video, #arjs-video, canvas, .a-fullscreen {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background-color: transparent !important;
        }

        /* Pantalla Inicial - Estética Mazairita */
        #pantalla-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: rgb(59, 76, 155);
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #pantalla-inicio h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: rgb(59, 76, 155);
            font-weight: bold;
        }

        #pantalla-inicio p {
            font-size: 16px;
            color: #555555;
            margin-bottom: 35px;
            max-width: 320px;
        }

        .btn-iniciar {
            background-color: rgb(59, 76, 155);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 76, 155, 0.35);
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-iniciar:active {
            transform: scale(0.95);
            background-color: #2d3b7c;
        }

        /* Pantalla de Carga semitransparente */
        #pantalla-carga {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #pantalla-carga h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid rgb(59, 76, 155);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 1s linear infinite;
            margin-top: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ocultar interfaces VR/AR predeterminadas */
        .a-enter-vr, .a-enter-ar, .a-orientation-modal {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. Pantalla Inicial -->
    <div id="pantalla-inicio">
        <h1>Producción Multimedial</h1>
        <p>Especialidad Técnica N° 20 "Carolina Muzilli"</p>
        <button class="btn-iniciar" id="btn-comenzar">🚀 INICIAR EXPERIENCIA AR</button>
    </div>

    <!-- 2. Pantalla de Carga intermedia -->
    <div id="pantalla-carga" style="display: none;">
        <h2>Bienvenido/a a la ET 20 - Carolina Muzzilli</h2>
        <p style="color: #ccc; font-size: 14px;">Iniciando cámara...</p>
        <div class="loader"></div>
    </div>

    <!-- Escena A-Frame con renderizador transparente forzado -->
    <a-scene 
        embedded
        renderer="alpha: true; antialias: true; colorManagement: true;"
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
        
        <a-assets>
            <a-asset-item id="Mazairita" src="MAZAIRITA-VERSION-FINAL-GIRO-UNIFICADO.glb"></a-asset-item>
            <audio id="audio-bienvenida" src="BIENVENIDA.mp3" preload="auto"></audio>
        </a-assets>

        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="directional" position="0 2 1" intensity="0.6"></a-light>

        <!-- CONTENEDOR GENERAL: Elevado en Y para que no quede cerca del piso (Y: 0.2) -->
        <a-entity id="contenedor-experiencia" position="0 0.2 -1.8">
            
            <!-- 1. PERSONAJE MAZAIRITA ANIMADO -->
            <a-entity 
                id="modelo-mazairita"
                gltf-model="#Mazairita" 
                scale="0.16 0.16 0.16"
                position="-0.55 0 0"
                rotation="0 25 0"
                reproductor-sincronizado>
            </a-entity>

            <!-- 2. PANEL DE TEXTO DE BIENVENIDA -->
            <a-entity position="0.55 0.15 0" rotation="0 -15 0">
                <a-plane width="1.8" height="0.9" color="#3b4c9b" opacity="0.9" radius="0.04"></a-plane>
                <a-text 
                    value="¡BIENVENIDO!\n\nEspecialidad de\nProduccion Multimedial" 
                    align="center" 
                    color="#FFFFFF" 
                    width="1.6" 
                    position="0 0 0.01">
