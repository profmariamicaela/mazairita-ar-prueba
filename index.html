<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mazairita AR - Bienvenida</title>
    
    <!-- Librería A-Frame Base -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Librería AR.js para acceso automático a la cámara web en el navegador -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Librería para reproducir las animaciones del modelo GLB -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* Botón superpuesto para iniciar audio y animación */
        .ar-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .btn-audio {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body style="margin: 0px; overflow: hidden;">

    <!-- Botón para iniciar audio y animación sincronizados -->
    <div class="ar-overlay">
        <button class="btn-audio" id="btn-play">▶ Escuchar a Mazairita</button>
    </div>

    <!-- Escena configurada para abrir directamente la cámara web mediante AR.js -->
    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
        vr-mode-ui="enabled: false">
        
        <!-- Carga de Archivos -->
        <a-assets>
            <a-asset-item id="Mazairita" src="MAZAIRITA-VERSION-FINAL-GIRO-UNIFICADO.glb"></a-asset-item>
            <audio id="audio-stand" src="audio/bienvenida.mp3" preload="auto"></audio>
        </a-assets>

        <a-light type="ambient" intensity="1.0"></a-light>

        <!-- Contenedor del Personaje y Panel (Ubicado a 2 metros frente a la cámara) -->
        <a-entity id="contenedor-experiencia" position="0 0 -2.5">
            
            <!-- 1. PERSONAJE MAZAIRITA CON CONTROL DE ANIMACIÓN -->
            <a-entity 
                id="modelo-mazairita"
                gltf-model="#Mazairita" 
                scale="0.2 0.2 0.2"
                position="-0.7 0 0"
                rotation="0 30 0"
                animation-mixer="clip: *; timeScale: 0;">
            </a-entity>

            <!-- 2. PANEL DE TEXTO DE BIENVENIDA -->
            <a-entity position="0.7 0.4 0" rotation="0 -15 0">
                <a-plane width="2.2" height="1.1" color="#111111" opacity="0.85" radius="0.05"></a-plane>
                <a-text 
                    value="¡BIENVENIDO!\n\nEspecialidad de\nProduccion Multimedial" 
                    align="center" 
                    color="#FFFFFF" 
                    width="1.8" 
                    position="0 0 0.01">
                </a-text>
            </a-entity>

            <!-- 3. BOTÓN +INFO (Interactivo al tocar con el dedo en la pantalla) -->
            <a-entity id="btn-mas-info" position="0.7 -0.3 0" rotation="0 -15 0" class="raycastable">
                <a-plane width="1.0" height="0.35" color="#2196F3" radius="0.03"></a-plane>
                <a-text value="+info" align="center" color="#FFFFFF" width="2.2" position="0 0 0.01"></a-text>
            </a-entity>

        </a-entity>

        <!-- CÁMARA (Permite clics/toques táctiles directos en pantalla sin el punto amarillo) -->
        <a-entity camera look-controls cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
        
    </a-scene>

    <script>
        // Lógica de sincronización entre Audio y Animación 3D
        document.getElementById('btn-play').addEventListener('click', function() {
            var audio = document.getElementById('audio-stand');
            var modelo = document.getElementById('modelo-mazairita');

            if (audio) {
                audio.currentTime = 0;
                audio.play();

                // Arranca la animación del modelo 3D
                modelo.setAttribute('animation-mixer', 'timeScale', 1);

                // Cuando finaliza el audio, pausa la animación 3D
                audio.onended = function() {
                    modelo.setAttribute('animation-mixer', 'timeScale', 0);
                };
            }
        });

        // Redirección al tocar el botón +info
        document.getElementById('btn-mas-info').addEventListener('click', function () {
            window.location.href = "year3.html"; 
        });
    </script>
</body>
</html>
