<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mazairita AR - Bienvenida</title>
    
    <!-- Librería A-Frame Nativa -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Librería para controlar animaciones del modelo .GLB -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100 %;
            height: 100 %;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Pantalla de inicio para activar AR + Audio con un toque */
        #pantalla-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100 %;
            height: 100 %;
            background: linear-gradient(135 deg, #1a1a1a 0%, #0d0d0d 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20 px;
            box-sizing: border-box;
        }

        #pantalla-inicio h1 {
            font-size: 24 px;
            margin-bottom: 10 px;
            color: #ff5722;
        }

        #pantalla-inicio p {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 30px;
            max-width: 300px;
        }

        .btn-iniciar {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 16 px 32 px;
            font-size: 18 px;
            font-weight: bold;
            border-radius: 30 px;
            cursor: pointer;
            box-shadow: 0 4 px 15 px rgba (255, 87, 34, 0.4);
            transition: transform 0.2 s;
        }

        .btn-iniciar:active {
            transform: scale (0.95);
        }

        /* Ocultar botones por defecto de A-Frame */
        .a-enter-vr {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Pantalla inicial requerida por navegadores móviles para disparar AR + Audio -->
    <div id="pantalla-inicio">
        <h1>Producción Multimedial</h1>
        <p>Especialidad Técnica N° 20 "Carolina Muzilli"</p>
        <button class="btn-iniciar" id="btn-comenzar">🚀 INICIAR EXPERIENCIA AR</button>
    </div>

    <!-- Escena A-Frame WebXR -->
    <a-scene 
        webxr="optionalFeatures: hit-test, local-floor;" 
        arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Carga de Recursos -->
        <a-assets>
            <a-asset-item id="Mazairita" src="MAZAIRITA-VERSION-FINAL-GIRO-UNIFICADO.glb"></a-asset-item>
            <audio id="audio-stand" src="audio/bienvenida.mp3" preload="auto"></audio>
        </a-assets>

        <a-light type="ambient" intensity="1.0"></a-light>

        <!-- Contenedor General (A 2 metros en el piso frente al usuario) -->
        <a-entity id="contenedor-experiencia" position="0 0 -2">
            
            <!-- 1. PERSONAJE MAZAIRITA (Animación pausada al inicio) -->
            <a-entity 
                id="modelo-mazairita"
                gltf-model="#Mazairita" 
                scale="0.2 0.2 0.2"
                position="-0.7 0 0"
                rotation="0 30 0"
                animation-mixer="clip: *; timeScale: 0;">
            </a-entity>

            <!-- 2. PANEL DE TEXTO DE BIENVENIDA -->
            <a-entity position="0.7 0.4 0" rotation="0 -15 0">
                <a-plane width="2.2" height="1.1" color="#111111" opacity="0.85" radius="0.05"></a-plane>
                <a-text 
                    value="¡BIENVENIDO!\n\nEspecialidad de\nProduccion Multimedial" 
                    align="center" 
                    color="#FFFFFF" 
                    width="1.8" 
                    position="0 0 0.01">
                </a-text>
            </a-entity>

            <!-- 3. BOTÓN +INFO (Toque directo en pantalla) -->
            <a-entity id="btn-mas-info" position="0.7 -0.3 0" rotation="0 -15 0" class="raycastable">
                <a-plane width="1.0" height="0.35" color="#2196F3" radius="0.03"></a-plane>
                <a-text value="+info" align="center" color="#FFFFFF" width="2.2" position="0 0 0.01"></a-text>
            </a-entity>

        </a-entity>

        <!-- CÁMARA (Limpia sin el punto amarillo) -->
        <a-entity camera look-controls cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
        
    </a-scene>

    <script>
        var sceneEl = document.querySelector('a-scene');
        var btnComenzar = document.getElementById('btn-comenzar');
        var pantallaInicio = document.getElementById('pantalla-inicio');

        btnComenzar.addEventListener('click', function () {
            // 1. Ocultar la pantalla de inicio
            pantallaInicio.style.display = 'none';

            // 2. Entrar en modo AR automáticamente al hacer clic en el botón
            if (sceneEl.is('vr-mode') === false) {
                sceneEl.enterVR(); // Esto activa el WebXR AR en móviles
            }

            // 3. Reproducir audio y sincronizar la animación 3D
            var audio = document.getElementById('audio-stand');
            var modelo = document.getElementById('modelo-mazairita');

            if (audio) {
                audio.currentTime = 0;
                audio.play();

                // Activar animación 3D del robot
                modelo.setAttribute('animation-mixer', 'timeScale', 1);

                // Pausar animación al finalizar el audio
                audio.onended = function() {
                    modelo.setAttribute('animation-mixer', 'timeScale', 0);
                };
            }
        });

        // Evento para navegar al siguiente stand (+info)
        document.getElementById('btn-mas-info').addEventListener('click', function () {
            window.location.href = "year3.html"; 
        });
    </script>
</body>
</html>
