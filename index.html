<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Expo E.T. N° 20 Carolina Muzilli - Producción Multimedial</title>

  <!-- Librerías de A-Frame y AR.js para Realidad Aumentada basada en cámara/marcador -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* PALETA DE COLORES UNIFICADA */
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117;
      color: #f0f6fc;
      overflow: hidden;
      height: 100vh;
    }

    /* Pantalla de Bienvenida (Necesaria para solicitar permisos de Cámara y Audio en celulares) */
    #screen-welcome {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1f293d 0%, #0d1117 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      z-index: 10000;
    }

    #screen-welcome h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #screen-welcome h2 {
      font-size: 16px;
      font-weight: 400;
      margin: 0 0 24px 0;
      color: #8b949e;
    }

    .btn-main {
      background: linear-gradient(135deg, #00e5ff 0%, #0088ff 100%);
      color: #0d1117;
      border: none;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-main:active {
      transform: scale(0.96);
    }

    /* Interfaz de Texto y Botones Superpuestos a la Cámara */
    #ar-ui {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .caption-card {
      background: rgba(22, 27, 34, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 229, 255, 0.2);
      color: #f0f6fc;
      padding: 18px 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 12px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .caption-card p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-line;
    }

    .options-group {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn-option {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-yes {
      background: #00e5ff;
      color: #0d1117;
    }

    .btn-yes:active {
      background: #00b0ff;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      color: #f0f6fc;
    }

    .btn-no:active {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <!-- 1. Pantalla Inicial (Necesaria por políticas de permisos de cámara y audio de iOS/Android) -->
  <div id="screen-welcome">
    <h1>Escuela Técnica N° 20 D.E. 20<br>"Carolina Muzzilli"</h1>
    <h2>Especialidad: Producción Multimedial</h2>
    <button class="btn-main" onclick="startExperience()">Iniciar Experiencia RA</button>
  </div>

  <!-- Audio de bienvenida -->
  <audio id="audio-welcome" src="audio1-bienvenida.mp3" preload="auto"></audio>

  <!-- 2. Interfaz de Texto y Botones superpuesta sobre el Live Video de la Cámara -->
  <div id="ar-ui">
    <div class="caption-card">
      <p id="ui-text"></p>
    </div>
    
    <div id="ui-buttons" class="options-group" style="display: none;">
      <button class="btn-option btn-yes" onclick="handleChoice(true)">SÍ</button>
      <button class="btn-option btn-no" onclick="handleChoice(false)">NO</button>
    </div>
  </div>

  <!-- 3. Escena de Realidad Aumentada sobre la Cámara -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="robot-model" src="mazairitaGIRO.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador en la entrada/afiche: cuando la cámara apunta al afiche, aparece el robot flotando -->
    <a-marker preset="hiro">
      <a-entity 
        id="mazairita"
        gltf-model="#robot-model"
        scale="1 1 1"
        position="0 0 0"
        rotation="0 0 0"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>

    const arUI = document.getElementById('ar-ui');
    const uiText = document.getElementById('ui-text');
    const uiButtons = document.getElementById('ui-buttons');
    const audio = document.getElementById('audio-welcome');

    function startExperience() {
      // Activa la cámara web inmediatamente y oculta el menú de inicio
      welcomeScreen.style.display = 'none';
      arUI.style.display = 'flex';
      
      // Carga el texto sobre el video en vivo
      uiText.innerText = welcomeSpeech;

      // Inicia la voz de Mazairita
      audio.play().catch(error => {
        console.log("Error al reproducir el audio:", error);
      });
    }
