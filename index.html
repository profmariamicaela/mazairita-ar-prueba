<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mazairita AR - Bienvenida</title>
    
    <!-- Librería A-Frame Base -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Librería aframe-extras para animaciones GLTF/GLB -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        /* Pantalla inicial de bienvenida */
        #pantalla-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #pantalla-inicio h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ff5722;
        }

        #pantalla-inicio p {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 30px;
            max-width: 300px;
        }

        .btn-iniciar {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.4);
        }

        /* Pantalla de carga */
        #pantalla-carga {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111111;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #pantalla-carga h2 {
            font-size: 20px;
            color: #2196F3;
            margin-bottom: 15px;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ocultar botones nativos de VR/AR */
        .a-enter-vr, .a-enter-ar {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. Pantalla de inicio -->
    <div id="pantalla-inicio">
        <h1>Producción Multimedial</h1>
        <p>Especialidad Técnica N° 20 "Carolina Muzilli"</p>
        <button class="btn-iniciar" id="btn-comenzar">🚀 INICIAR EXPERIENCIA AR</button>
    </div>

    <!-- 2. Pantalla de carga intermedia -->
    <div id="pantalla-carga" style="display: none;">
        <h2>Bienvenido/a a la ET 20 - Carolina Muzzilli</h2>
        <p style="color: #aaa; font-size: 14px;">Iniciando Mazairita y entorno AR...</p>
        <div class="loader"></div>
    </div>

    <!-- Escena WebXR -->
    <a-scene 
        webxr="optionalFeatures: hit-test, local-floor;"
        vr-mode-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="Mazairita" src="MAZAIRITA-VERSION-FINAL-GIRO-UNIFICADO.glb"></a-asset-item>
            <audio id="audio-stand" src="audio/bienvenida.mp3" preload="auto"></audio>
        </a-assets>

        <a-light type="ambient" intensity="1.2"></a-light>
        <a-light type="directional" position="1 4 1" intensity="0.5"></a-light>

        <!-- Contenedor 3D Emplazado -->
        <a-entity id="contenedor-experiencia" position="0 -1 -1.5">
            
            <!-- MODELO MAZAIRITA CON AUTO-ACTIVADOR DE ANIMACIÓN (reproductor-animacion) -->
            <a-entity 
                id="modelo-mazairita"
                gltf-model="#Mazairita" 
                scale="0.18 0.18 0.18"
                position="-0.6 0 0"
                rotation="0 30 0"
                reproductor-animacion>
            </a-entity>

            <!-- PANEL DE TEXTO -->
            <a-entity position="0.6 0.6 0" rotation="0 -20 0">
                <a-plane width="1.8" height="0.9" color="#111111" opacity="0.85" radius="0.04"></a-plane>
                <a-text 
                    value="¡BIENVENIDO!\n\nEspecialidad de\nProduccion Multimedial" 
                    align="center" 
                    color="#FFFFFF" 
                    width="1.6" 
                    position="0 0 0.01">
                </a-text>
            </a-entity>

            <!-- BOTÓN +INFO -->
            <a-entity id="btn-mas-info" position="0.6 0.05 0" rotation="0 -20 0" class="raycastable">
                <a-plane width="0.9" height="0.3" color="#2196F3" radius="0.03"></a-plane>
                <a-text value="+info" align="center" color="#FFFFFF" width="2" position="0 0 0.01"></a-text>
            </a-entity>

        </a-entity>

        <!-- CÁMARA LIBRE -->
        <a-entity camera look-controls cursor="rayOrigin: mouse" raycaster="objects: .raycastable"></a-entity>
        
    </a-scene>

    <script>
        // COMPONENTE PERSONALIZADO: Fuerza la reproducción de cualquier animación interna del .GLB
        AFRAME.registerComponent('reproductor-animacion', {
            init: function () {
                var el = this.el;
                el.addEventListener('model-loaded', function () {
                    var model = el.getObject3D('mesh');
                    if (model && model.animations && model.animations.length > 0) {
                        // Toma el nombre exacto de la primera animación que encuentre en el archivo GLB
                        var nombreAnimacion = model.animations[0].name;
                        
                        // Le asigna el mixer a A-Frame dinámicamente con ese nombre
                        el.setAttribute('animation-mixer', {
                            clip: nombreAnimacion,
                            loop: 'repeat',
                            timeScale: 1
                        });
                        console.log("Animación detectada e iniciada:", nombreAnimacion);
                    } else {
                        console.warn("El archivo GLB se cargó pero no contiene clips de animación embebidos.");
                    }
                });
            }
        });

        var btnComenzar = document.getElementById('btn-comenzar');
        var pantallaInicio = document.getElementById('pantalla-inicio');
        var pantallaCarga = document.getElementById('pantalla-carga');
        var sceneEl = document.querySelector('a-scene');

        btnComenzar.addEventListener('click', function () {
            pantallaInicio.style.display = 'none';
            pantallaCarga.style.display = 'flex';

            if (sceneEl.is('vr-mode') === false) {
                sceneEl.enterVR();
            }

            var audio = document.getElementById('audio-stand');
            if (audio) {
                audio.currentTime = 0;
                audio.play();
            }

            setTimeout(function() {
                pantallaCarga.style.display = 'none';
            }, 1200);
        });

        document.getElementById('btn-mas-info').addEventListener('click', function () {
            window.location.href = "year3.html"; 
        });
    </script>
</body>
</html>
